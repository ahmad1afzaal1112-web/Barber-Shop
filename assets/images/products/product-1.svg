<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="prodBg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262830" />
      <stop offset="100%" stop-color="#111214" />
    </radialGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9B182" />
      <stop offset="50%" stop-color="#F5E6C8" />
      <stop offset="100%" stop-color="#9C804B" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#prodBg1)" rx="8"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(201,177,130,0.15)" stroke-width="1.5"/>

  <!-- Pomade Jar -->
  <g transform="translate(200, 200)">
    <!-- Shadow -->
    <ellipse cx="0" cy="90" rx="100" ry="20" fill="#050607" opacity="0.6"/>
    <!-- Glass Jar Body -->
    <rect x="-90" y="-20" width="180" height="95" rx="10" fill="#1e2026" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <!-- Label -->
    <rect x="-80" y="-5" width="160" height="65" rx="4" fill="#131417" stroke="#C9B182" stroke-width="1"/>
    <text x="0" y="20" font-family="'Cormorant Infant', serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KRE8 CLAY</text>
    <text x="0" y="38" font-family="'Inter Tight', sans-serif" font-size="8" font-weight="600" fill="#C9B182" text-anchor="middle" letter-spacing="1.5">MATTE FINISH • STRONG HOLD</text>
    <!-- Gold Lid -->
    <rect x="-96" y="-55" width="192" height="35" rx="6" fill="url(#goldCap)" stroke="#7A6335" stroke-width="1"/>
    <line x1="-90" y1="-38" x2="90" y2="-38" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  </g>
</svg>
