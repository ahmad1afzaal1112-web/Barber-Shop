<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="prodBg4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222830" />
      <stop offset="100%" stop-color="#111214" />
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#prodBg4)" rx="8"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(201,177,130,0.15)" stroke-width="1.5"/>

  <!-- Straight Razor Opened Graphic -->
  <g transform="translate(200, 200) rotate(-20)">
    <ellipse cx="0" cy="110" rx="110" ry="18" fill="#050607" opacity="0.6"/>
    <!-- Damascus Blade -->
    <path d="M-90 -40 Q0 -90 120 -40 L100 0 Q0 -50 -90 -10 Z" fill="url(#bladeGrad)" stroke="#C9B182" stroke-width="1.5"/>
    <!-- Razor Scales (Handle) -->
    <path d="M-90 -40 L-150 70 Q-160 95 -135 105 L-80 0" fill="#2d1d11" stroke="#C9B182" stroke-width="2"/>
    <circle cx="-145" cy="85" r="5" fill="#C9B182"/>
    <circle cx="-90" cy="-40" r="4" fill="#C9B182"/>
  </g>
  <text x="200" y="340" font-family="'Cormorant Infant', serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">DAMASCUS RAZOR</text>
</svg>
