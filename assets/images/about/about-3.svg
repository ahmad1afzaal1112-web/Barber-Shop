    <!-- Light Bulbs on Mirror -->
    <circle cx="-80" cy="-20" r="4" fill="#C9B182"/>
    <circle cx="-80" cy="30" r="4" fill="#C9B182"/>
    <circle cx="80" cy="-20" r="4" fill="#C9B182"/>
    <circle cx="80" cy="30" r="4" fill="#C9B182"/>
    <circle cx="0" cy="-100" r="4" fill="#C9B182"/>
    
