      <stop offset="0%" stop-color="#1b1c21" />
      <stop offset="100%" stop-color="#0e0f11" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#abGrad3)"/>
  <rect x="12" y="12" width="326" height="396" rx="8" fill="none" stroke="rgba(201,177,130,0.3)" stroke-width="1.5"/>

