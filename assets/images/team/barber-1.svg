<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="500" height="620">
  <defs>
    <linearGradient id="teamGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22252c" />
      <stop offset="60%" stop-color="#141518" />
      <stop offset="100%" stop-color="#0b0c0e" />
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8" />
      <stop offset="100%" stop-color="#C9B182" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#teamGrad1)"/>
  
  <!-- Subtle Background Pattern -->
  <circle cx="250" cy="220" r="160" fill="none" stroke="rgba(201,177,130,0.15)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="250" cy="220" r="210" fill="none" stroke="rgba(201,177,130,0.08)" stroke-width="1"/>

  <!-- Alexander Pierce Barber Figure -->
  <g transform="translate(250, 310)">
    <!-- Vest & Suit Silhouette -->
    <path d="M-150 260 C-150 160 -90 120 -40 110 L40 110 C90 120 150 160 150 260 Z" fill="#17191e" stroke="rgba(201,177,130,0.4)" stroke-width="2"/>
    <!-- Gold Tie / Apron Straps -->
    <line x1="-30" y1="110" x2="30" y2="240" stroke="#C9B182" stroke-width="2.5"/>
    <line x1="30" y1="110" x2="-30" y2="240" stroke="#C9B182" stroke-width="2.5"/>
    <!-- Head & Beard -->
    <rect x="-28" y="50" width="56" height="70" rx="6" fill="#352e27"/>
    <path d="M-55 -30 C-55 50 -40 90 0 100 C40 90 55 50 55 -30 C55 -80 -55 -80 -55 -30 Z" fill="#443930"/>
    <!-- Short Slick Pompadour -->
    <path d="M-60 -30 C-70 -100 10 -120 40 -90 C60 -70 55 -30 45 -10 C35 -50 0 -80 -45 -50 Z" fill="#111214"/>
    <!-- Beard Trim -->
    <path d="M-50 0 C-50 70 -30 110 0 115 C30 110 50 70 50 0 C35 25 15 30 0 30 C-15 30 -35 25 -50 0 Z" fill="#111214"/>
    <!-- Scissors Icon on Pocket -->
    <g transform="translate(70, 150) scale(0.7)">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#C9B182" stroke-width="2"/>
      <circle cx="10" cy="30" r="8" fill="none" stroke="#C9B182" stroke-width="2"/>
      <line x1="15" y1="12" x2="45" y2="35" stroke="#C9B182" stroke-width="2"/>
      <line x1="15" y1="28" x2="45" y2="5" stroke="#C9B182" stroke-width="2"/>
    </g>
  </g>

  <!-- Barber Name Tag -->
  <rect x="50" y="520" width="400" height="70" rx="8" fill="rgba(17,18,20,0.85)" stroke="rgba(201,177,130,0.3)" stroke-width="1"/>
  <text x="250" y="548" font-family="'Cormorant Infant', serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Alexander Pierce</text>
  <text x="250" y="572" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="600" fill="url(#goldSheen)" text-anchor="middle" letter-spacing="2">FOUNDER &amp; MASTER STYLIST</text>
</svg>
