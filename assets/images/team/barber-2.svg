    <path d="M-55 -10 C-60 90 -35 150 0 160 C35 150 60 90 55 -10 C40 25 15 35 0 35 C-15 35 -40 25 -55 -10 Z" fill="#111214"/>
  </g>

  <!-- Name Card -->
  <rect x="50" y="520" width="400" height="70" rx="8" fill="rgba(17,18,20,0.85)" stroke="rgba(201,177,130,0.3)" stroke-width="1"/>
  <text x="250" y="548" font-family="'Cormorant Infant', serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Marcus Vance</text>
  <text x="250" y="572" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="600" fill="url(#goldSheen2)" text-anchor="middle" letter-spacing="2">SENIOR BEARD ARTISAN</text>
