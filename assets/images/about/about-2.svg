<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="abGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242730" />
      <stop offset="60%" stop-color="#15161a" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#abGrad2)"/>
  <rect x="15" y="15" width="370" height="470" rx="8" fill="none" stroke="rgba(201,177,130,0.35)" stroke-width="1.5"/>

  <!-- Vintage Razor & Hot Towel Illustration -->
  <g transform="translate(200, 240) scale(1.1)">
    <!-- Razor Blade -->
    <path d="M-80 -60 Q0 -100 100 -50 L80 -20 Q0 -70 -80 -30 Z" fill="#C9B182"/>
    <path d="M-80 -60 L-120 40 Q-130 60 -110 70 L-70 -20" fill="#2d3038" stroke="#C9B182" stroke-width="1.5"/>
    <circle cx="-115" cy="55" r="5" fill="#C9B182"/>
    <!-- Steaming Towel -->
    <ellipse cx="0" cy="110" rx="80" ry="30" fill="#181a1f" stroke="rgba(201,177,130,0.5)" stroke-width="1.5"/>
    <path d="M-60 90 Q0 60 60 90 Q0 120 -60 90 Z" fill="#C9B182" opacity="0.3"/>
    <!-- Steam Swirls -->
    <path d="M-20 60 Q-40 30 -20 0 Q0 -30 -10 -50" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 60 Q40 30 20 0 Q0 -30 10 -50" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="200" y="440" font-family="'Cormorant Infant', serif" font-size="20" font-weight="600" fill="#C9B182" text-anchor="middle" letter-spacing="2">ROYAL SHAVING RITUAL</text>
</svg>
