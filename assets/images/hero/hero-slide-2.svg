<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="heroDarkVignette2" cx="40%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#191c22" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#111214" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#070809" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldBeam2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9B182" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#A48B59" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#111214" stop-opacity="0" />
    </linearGradient>
    <pattern id="luxDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="rgba(201, 177, 130, 0.08)"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#111214"/>
  <rect width="100%" height="100%" fill="url(#luxDots)"/>

  <!-- Atmospheric Glows -->
  <circle cx="70%" cy="60%" r="550" fill="#C9B182" opacity="0.09" filter="blur(100px)"/>
  <circle cx="30%" cy="30%" r="450" fill="#8E784D" opacity="0.06" filter="blur(90px)"/>

  <!-- Dynamic Geometric Angles -->
  <polygon points="0,0 800,0 400,1080 0,1080" fill="url(#goldBeam2)" opacity="0.5"/>
  
  <!-- Straight Razor & Shaving Brush Line Art -->
  <g transform="translate(1150, 160) scale(1.3)" opacity="0.2">
    <!-- Straight Razor -->
    <path d="M120 180 Q220 120 380 160 L360 210 Q220 180 120 230 Z" fill="none" stroke="#C9B182" stroke-width="2.5"/>
    <path d="M120 180 L40 320 Q20 350 50 370 L160 215" fill="none" stroke="#C9B182" stroke-width="2.5"/>
    <!-- Shaving Brush -->
    <path d="M300 450 C300 420 340 350 380 320 C420 350 460 420 460 450 Z" fill="none" stroke="#C9B182" stroke-width="2"/>
    <rect x="330" y="450" width="100" height="80" rx="10" fill="none" stroke="#C9B182" stroke-width="2"/>
  </g>

  <!-- Dark Overlay Vignette -->
  <rect width="100%" height="100%" fill="url(#heroDarkVignette2)"/>
</svg>
