<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8" />
      <stop offset="50%" stop-color="#C9B182" />
      <stop offset="100%" stop-color="#9C804B" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Scissors Icon Element -->
  <g transform="translate(10, 8)" filter="url(#goldGlow)">
    <circle cx="12" cy="12" r="5.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <circle cx="12" cy="32" r="5.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <path d="M16 14.5 L36 34" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M16 29.5 L36 10" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="25" cy="22" r="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <text x="56" y="36" font-family="'Cormorant Infant', Georgia, serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="4">KRE8</text>
  <text x="144" y="24" font-family="'Cormorant Infant', Georgia, serif" font-size="14" font-weight="600" fill="url(#goldGrad)" letter-spacing="3">BARBER</text>
  <text x="144" y="38" font-family="'Inter Tight', sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="2">EST. 2012</text>
  
  <line x1="56" y1="44" x2="210" y2="44" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
</svg>
