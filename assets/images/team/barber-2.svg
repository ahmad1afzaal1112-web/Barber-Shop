  </defs>
  <rect width="100%" height="100%" fill="url(#teamGrad2)"/>
  
  <circle cx="250" cy="220" r="160" fill="none" stroke="rgba(201,177,130,0.15)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="250" cy="220" r="210" fill="none" stroke="rgba(201,177,130,0.08)" stroke-width="1"/>

  <!-- Marcus Vance Figure (Full Beard Specialist) -->
  <g transform="translate(250, 310)">
    <path d="M-150 260 C-150 160 -90 120 -40 110 L40 110 C90 120 150 160 150 260 Z" fill="#1b1c1e" stroke="rgba(201,177,130,0.4)" stroke-width="2"/>
    <!-- Leather Apron Center -->
    <rect x="-40" y="110" width="80" height="150" fill="#2d2217" stroke="#C9B182" stroke-width="1"/>
    <!-- Head & Prominent Beard -->
    <rect x="-28" y="50" width="56" height="70" rx="6" fill="#3d3328"/>
    <path d="M-55 -30 C-55 50 -40 90 0 100 C40 90 55 50 55 -30 C55 -80 -55 -80 -55 -30 Z" fill="#4a3e30"/>
    <!-- Buzzcut Fade -->
