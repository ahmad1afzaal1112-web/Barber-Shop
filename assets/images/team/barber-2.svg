      <stop offset="0%" stop-color="#282622" />
      <stop offset="60%" stop-color="#181716" />
      <stop offset="100%" stop-color="#0b0c0e" />
    </linearGradient>
    <linearGradient id="goldSheen2" x1="0%" y1="0%" x2="100%" y2="100%">
