<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="faqBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211a" />
      <stop offset="60%" stop-color="#141518" />
      <stop offset="100%" stop-color="#0b0c0e" />
    </linearGradient>
    <linearGradient id="goldStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8" />
      <stop offset="100%" stop-color="#C9B182" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#faqBgGrad)"/>
  <rect x="15" y="15" width="470" height="570" rx="8" fill="none" stroke="url(#goldStrokeGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Luxury Barber Pole and Clock Motif -->
  <g transform="translate(250, 270)">
    <!-- Barber Pole -->
    <rect x="-35" y="-120" width="70" height="240" rx="35" fill="#181a1f" stroke="#C9B182" stroke-width="2"/>
    <!-- Stripes -->
    <path d="M-30 -70 L30 -20 L30 10 L-30 -40 Z" fill="#C9B182" opacity="0.6"/>
    <path d="M-30 0 L30 50 L30 80 L-30 30 Z" fill="#C9B182" opacity="0.6"/>
    <path d="M-30 -110 L30 -60 L30 -40 L-30 -90 Z" fill="#FFFFFF" opacity="0.3"/>
    <path d="M-30 -30 L30 20 L30 40 L-30 -10 Z" fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Top & Bottom Caps -->
    <circle cx="0" cy="-135" r="22" fill="#C9B182"/>
    <circle cx="0" cy="135" r="22" fill="#C9B182"/>
  </g>

  <text x="250" y="470" font-family="'Cormorant Infant', serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">GOT ANY QUESTIONS?</text>
  <text x="250" y="495" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="600" fill="#C9B182" text-anchor="middle" letter-spacing="2">WE ARE HERE TO ASSIST YOU</text>
</svg>
